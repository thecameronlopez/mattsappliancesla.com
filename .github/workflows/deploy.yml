name: Deploy mattsappliancesla.com

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            PUBLIC_CLOUDINARY_CLOUD_NAME=${{ secrets.PUBLIC_CLOUDINARY_CLOUD_NAME }}
            PUBLIC_CLOUDINARY_CAROUSEL_TAG=${{ secrets.PUBLIC_CLOUDINARY_CAROUSEL_TAG }}
            PUBLIC_CLOUDINARY_HERO_VIDEO_PUBLIC_ID=${{ secrets.PUBLIC_CLOUDINARY_HERO_VIDEO_PUBLIC_ID }}
          tags: |
            mattsappliances/astro-mattsappliancesla:latest
            mattsappliances/astro-mattsappliancesla:${{ github.sha }}
